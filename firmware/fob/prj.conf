# Bluetooth: broadcaster (the press) and observer (the ack). No connections, no GATT.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_EXT_ADV=n
CONFIG_BT_DEVICE_NAME="iphone-remote"

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ENTROPY_GENERATOR=y

# Small: the nRF52810 has 192 KB flash and 24 KB RAM.
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_SIZE_OPTIMIZATIONS=y
